# MG Stealth: tests on every push; a tag v<version> builds the packages and creates the GitLab Release
# whose asset mg-stealth-<version>.zip the plugin's update checker installs.
stages:
  - test
  - build
  - release

test:
  stage: test
  image: composer:2
  script:
    - composer install --no-interaction --no-progress
    - vendor/bin/phpunit
    - find . -path ./vendor -prune -o -path ./lib -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

build:
  stage: build
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - apk add --no-cache bash rsync zip sed grep curl
    - VERSION="${CI_COMMIT_TAG#v}"
    - bin/build.sh
    - test -f "build/mg-stealth-${VERSION}.zip"
    - |
      for file in "mg-stealth-${VERSION}.zip" "mg-stealth-${VERSION}-wporg.zip"; do
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "build/${file}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mg-stealth/${VERSION}/${file}"
      done
    - echo "VERSION=${VERSION}" > release.env
    - echo "PACKAGE_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mg-stealth/${VERSION}" >> release.env
  artifacts:
    paths:
      - build/*.zip
    reports:
      dotenv: release.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Release MG Stealth ${VERSION}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'MG Stealth $VERSION'
    description: 'MG Stealth $VERSION. Changelog: readme.txt. Install or update with mg-stealth-$VERSION.zip; the -wporg package is the WordPress.org build without the update checker.'
    assets:
      links:
        - name: 'mg-stealth-$VERSION.zip'
          url: '$PACKAGE_URL/mg-stealth-$VERSION.zip'
          link_type: package
        - name: 'mg-stealth-$VERSION-wporg.zip'
          url: '$PACKAGE_URL/mg-stealth-$VERSION-wporg.zip'
          link_type: other
